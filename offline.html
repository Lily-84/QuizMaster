<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizMaster — Multiple Choice Quiz Builder</title>
<script>
  (function(){
    try {
      var t = localStorage.getItem('quizmaster.theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  /* ============ THEME VARIABLES ============ */
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1f2937;
    --text-muted: #6b7280;
    --text-subtle: #9ca3af;
    --hover: #f3f4f6;

    --accent: #4f46e5;
    --accent-bg: #eef2ff;
    --accent-border: #c7d2fe;
    --accent-text: #4338ca;

    --primary-btn: #4f46e5;
    --primary-btn-hover: #4338ca;
    --primary-btn-text: #ffffff;

    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;

    --success: #16a34a;
    --success-bg: #dcfce7;
    --success-border: #86efac;
    --success-text: #166534;

    --warn-bg: #fee2e2;
    --warn-text: #b91c1c;
    --warn-border: #fecaca;

    --option-border-hover: #a5b4fc;
    --option-hover-bg: #f8f9ff;
    --letter-bg: #f3f4f6;
    --letter-text: #4b5563;
    --qitem-border: #f1f2f6;

    --explain-bg: #f8fafc;
    --explain-text: #475569;
    --explain-border: #cbd5e1;

    --review-ok: #22c55e;
    --review-bad: #ef4444;

    --input-bg: #ffffff;
    --toast-bg: #1f2937;
    --toast-text: #ffffff;
    --overlay: rgba(0,0,0,0.5);
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --border-strong: #475569;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --hover: #334155;

    --accent: #818cf8;
    --accent-bg: #1e1b4b;
    --accent-border: #3730a3;
    --accent-text: #c7d2fe;

    --primary-btn: #6366f1;
    --primary-btn-hover: #818cf8;
    --primary-btn-text: #ffffff;

    --danger: #f87171;
    --danger-bg: #450a0a;
    --danger-border: #7f1d1d;

    --success: #4ade80;
    --success-bg: #14532d;
    --success-border: #166534;
    --success-text: #86efac;

    --warn-bg: #7f1d1d;
    --warn-text: #fca5a5;
    --warn-border: #991b1b;

    --option-border-hover: #6366f1;
    --option-hover-bg: #243247;
    --letter-bg: #334155;
    --letter-text: #cbd5e1;
    --qitem-border: #334155;

    --explain-bg: #0b1220;
    --explain-text: #cbd5e1;
    --explain-border: #475569;

    --review-ok: #22c55e;
    --review-bad: #ef4444;

    --input-bg: #0f172a;
    --toast-bg: #e2e8f0;
    --toast-text: #0f172a;
    --overlay: rgba(0,0,0,0.65);
  }

  /* ============ BASE ============ */
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5}
  body,.topbar,.card,.input,.modal{transition:background-color .25s ease,color .25s ease,border-color .25s ease}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;
          display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:17px;color:var(--accent);cursor:pointer;letter-spacing:-.2px}
  .brand:hover{opacity:.8}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}

  h1.h1{font-size:22px;margin:0;font-weight:700}
  h3{font-size:15px;margin:0 0 12px}
  .muted{color:var(--text-muted);font-size:13px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
             margin-bottom:20px;flex-wrap:wrap}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}

  /* ============ BUTTONS ============ */
  .btn{border:1px solid var(--border-strong);background:var(--surface);padding:8px 14px;border-radius:8px;
       cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;color:var(--text);
       transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.block{width:100%;display:block;margin-top:10px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-left:0}
  .btn.ghost:hover{background:var(--accent-bg)}
  .btn.primary{background:var(--primary-btn);border-color:var(--primary-btn);color:var(--primary-btn-text)}
  .btn.primary:hover{background:var(--primary-btn-hover);border-color:var(--primary-btn-hover)}
  .btn.danger{color:var(--danger);border-color:var(--danger-border)}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{background:var(--surface)}

  /* ============ CARDS & LAYOUT ============ */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .exam-card{display:flex;flex-direction:column;margin:0}
  .exam-card h3{margin:0 0 4px;font-size:16px}
  .exam-card .desc{font-size:13px;color:var(--text-muted);min-height:19px;
                   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:flex;gap:12px;color:var(--text-muted);font-size:12.5px;margin:12px 0 14px;flex-wrap:wrap}
  .meta b{color:var(--text)}
  .actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

  .empty{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:48px 24px;
         text-align:center;color:var(--text-subtle);font-size:14px}

  /* ============ FORMS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
  .input{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;
         font-family:inherit;background:var(--input-bg);color:var(--text);transition:.15s}
  .input:focus{outline:2px solid var(--accent-border);border-color:var(--accent);outline-offset:-1px}
  textarea.input{resize:vertical;min-height:80px;line-height:1.5}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.two-col{grid-template-columns:1fr}}

  .layout{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .layout .card{margin-bottom:0}

  /* ============ QUESTION LIST ============ */
  .qitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--qitem-border)}
  .qitem:last-child{border-bottom:none;padding-bottom:0}
  .qitem:first-child{padding-top:0}
  .qitem-main{flex:1;min-width:0}
  .qitem-text{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qitem-sub{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qnum{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent-text);
        font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .opt-row input[type=radio]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .opt-row .letter-badge{width:22px;font-size:12px;font-weight:700;color:var(--text-muted);flex-shrink:0}

  /* ============ QUIZ ============ */
  .quiz-head{display:flex;justify-content:space-between;align-items:center;gap:16px;
             margin-bottom:20px;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:var(--accent-bg);
         color:var(--accent-text);padding:6px 14px;border-radius:8px;border:1px solid var(--accent-border)}
  .timer.low{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
  .question-card .q-index{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;
                          text-transform:uppercase;margin-bottom:8px}
  .q-text{font-size:17px;font-weight:600;margin:0 0 18px;line-height:1.55}
  .option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;
          border:1.5px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;
          font-size:15px;margin-bottom:10px;transition:.15s;font-family:inherit;color:inherit;line-height:1.45}
  .option:last-child{margin-bottom:0}
  .option:hover{border-color:var(--option-border-hover);background:var(--option-hover-bg)}
  .option.selected{border-color:var(--accent);background:var(--accent-bg)}
  .letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
          border-radius:50%;background:var(--letter-bg);font-size:12.5px;font-weight:700;
          flex-shrink:0;color:var(--letter-text)}
  .option.selected .letter{background:var(--primary-btn);color:var(--primary-btn-text)}
  .nav-row{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--qitem-border);flex-wrap:wrap}
  .nav-row .btn:last-child{margin-left:auto}

  .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;margin-bottom:14px}
  .pal{height:38px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;
       font-weight:600;font-size:13px;color:var(--text-muted);font-family:inherit;transition:.15s}
  .pal:hover{border-color:var(--option-border-hover)}
  .pal.answered{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
  .pal.current{outline:2px solid var(--accent);outline-offset:1px;font-weight:800}
  .pal.submitted{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent-text)}

  /* ============ RESULT ============ */
  .score-hero{text-align:center;padding:32px 20px}
  .score-big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
  .score-big.pass{color:var(--success)}
  .score-big.fail{color:var(--danger)}
  .score-sub{color:var(--text-muted);font-size:14px;margin-top:8px}
  .stat-row{display:flex;justify-content:center;gap:36px;margin-top:24px;flex-wrap:wrap}
  .stat b{display:block;font-size:20px;font-weight:700}
  .stat span{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}

  .review{margin-bottom:14px;border-left:4px solid var(--border)}
  .review.ok{border-left-color:var(--review-ok)}
  .review.bad{border-left-color:var(--review-bad)}
  .review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;
         letter-spacing:.4px;display:inline-block}
  .badge.ok{background:var(--success-bg);color:var(--success-text)}
  .badge.bad{background:var(--warn-bg);color:var(--warn-text)}
  .badge.mode{background:var(--accent-bg);color:var(--accent-text)}
  .review .q-text{font-size:15px;margin-bottom:12px}
  .ropt{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:14px;
        margin-bottom:6px;border:1px solid transparent}
  .ropt:last-child{margin-bottom:0}
  .ropt.correct{background:var(--success-bg);border-color:var(--success-border)}
  .ropt.wrong{background:var(--danger-bg);border-color:var(--danger-border)}
  .ropt .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--success-text);white-space:nowrap}
  .ropt .tag.bad{color:var(--danger)}
  .explain{margin-top:12px;padding:10px 14px;background:var(--explain-bg);border-radius:8px;
           font-size:13.5px;color:var(--explain-text);border-left:3px solid var(--explain-border)}

  /* ============ MODAL ============ */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;
                 justify-content:center;z-index:50;padding:20px;animation:fadeIn .15s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;
         max-width:480px;width:100%;max-height:90vh;overflow-y:auto;
         box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:popIn .2s ease}
  @keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{margin:0 0 16px;font-size:18px;font-weight:700}
  .mode-option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--border);
               border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .mode-option:hover{border-color:var(--option-border-hover)}
  .mode-option.selected{border-color:var(--accent);background:var(--accent-bg)}
  .mode-option input[type=radio]{margin-top:4px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .mode-option .mo-title{font-weight:700;font-size:14px}
  .mode-option .mo-desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;line-height:1.45}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{padding:7px 14px;border:1.5px solid var(--border-strong);background:var(--surface);border-radius:20px;
        font-size:13px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.active{background:var(--primary-btn);border-color:var(--primary-btn);color:var(--primary-btn-text)}
  .chip.active:hover{background:var(--primary-btn-hover);color:var(--primary-btn-text)}

  /* ============ TOAST ============ */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--toast-bg);
         color:var(--toast-text);padding:11px 22px;border-radius:10px;font-size:14px;z-index:100;
         box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ============ MISC ============ */
  .cluster-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .cluster-tab{padding:8px 16px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;
               font-size:13px;font-weight:600;cursor:pointer;color:var(--text-muted);font-family:inherit;
               transition:.15s;white-space:nowrap}
  .cluster-tab:hover{border-color:var(--option-border-hover);color:var(--text)}
  .cluster-tab.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
  .cluster-tab.done{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
  .cluster-tab.done.active{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="goHome()">📝 QuizMaster</div>
  <div class="spacer"></div>
  <button class="btn sm" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
</div>

<main id="app"></main>

<!-- ============ START MODAL ============ -->
<div id="start-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeStartModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Start: <span id="modal-exam-title" style="color:var(--accent)"></span></h2>

    <div class="field">
      <label>Choose mode</label>
      <div class="mode-option selected" data-mode="exam" onclick="selectMode('exam')">
        <input type="radio" name="mode" value="exam" checked>
        <div>
          <div class="mo-title">📝 Exam mode</div>
          <div class="mo-desc" id="exam-mode-desc">Timed · all questions at once · results saved</div>
        </div>
      </div>
      <div class="mode-option" data-mode="practice" onclick="selectMode('practice')">
        <input type="radio" name="mode" value="practice">
        <div>
          <div class="mo-title">🎯 Practice mode</div>
          <div class="mo-desc">No timer · questions split into clusters · see answers after each cluster · can revisit</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Question order <span class="muted" style="font-weight:400">(applies to both modes)</span></label>
      <div class="chip-row">
        <button type="button" class="chip" data-order="forward" onclick="selectOrder('forward')">↓ Top to bottom</button>
        <button type="button" class="chip" data-order="reverse" onclick="selectOrder('reverse')">↑ Bottom to top</button>
        <button type="button" class="chip" data-order="random" onclick="selectOrder('random')">🔀 Random</button>
      </div>
    </div>

    <div id="exam-options">
      <div class="field">
        <label>Time limit (minutes) — 0 = no limit</label>
        <input class="input" type="number" min="0" id="exam-time" value="0" style="max-width:160px">
      </div>
    </div>

    <div id="practice-options" style="display:none">
      <div class="field">
        <label>Questions per cluster</label>
        <div class="chip-row">
          <button type="button" class="chip" data-size="5" onclick="setClusterSize(5,this)">5</button>
          <button type="button" class="chip" data-size="10" onclick="setClusterSize(10,this)">10</button>
          <input class="input" type="number" min="1" id="cluster-size" value="5" style="width:100px"
                 oninput="syncClusterChips()">
          <span class="muted">questions</span>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn" onclick="closeStartModal()">Cancel</button>
      <button class="btn primary" onclick="confirmStart()">Start →</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   THEME
   ========================================================= */
const THEME_KEY = 'quizmaster.theme';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    if (theme === 'dark') {
      btn.textContent = '🌙 Dark';
      btn.title = 'Switch to light theme';
    } else {
      btn.textContent = '☀️ Light';
      btn.title = 'Switch to dark theme';
    }
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

/* =========================================================
   STATE
   ========================================================= */
const LS_KEY = 'quizmaster.exams.v1';

let exams = [];
let view = 'list';        // list | editor | quiz | practice | result
let draft = null;
let draftSnapshot = '';
let qForm = null;
let run = null;
let lastResult = null;
let timerId = null;

/* modal state */
let modalExamId = null;
let modalMode = 'exam';
let modalOrder = 'forward';

/* =========================================================
   HELPERS
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric',
                                       hour: '2-digit', minute: '2-digit' });
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function load() {
  try { exams = JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { exams = []; }
  exams.forEach(e => { e.questions = e.questions || []; e.attempts = e.attempts || []; });
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(exams)); }

/* =========================================================
   RENDER
   ========================================================= */
function render(keepScroll) {
  const y = window.scrollY;
  const app = document.getElementById('app');
  if (view === 'list')          app.innerHTML = listHTML();
  else if (view === 'editor')   app.innerHTML = editorHTML();
  else if (view === 'quiz')     app.innerHTML = quizHTML();
  else if (view === 'practice') app.innerHTML = practiceHTML();
  else if (view === 'result')   app.innerHTML = resultHTML();

  window.scrollTo(0, keepScroll ? y : 0);

  if (view === 'quiz' && run && run.endsAt) {
    const el = document.getElementById('timer');
    if (el) {
      const left = run.endsAt - Date.now();
      el.textContent = fmtTime(left);
      if (left < 60000) el.classList.add('low');
    }
  }
}

/* =========================================================
   VIEW: EXAM LIST
   ========================================================= */

/* =========================================================
   START MODAL
   ========================================================= */
function openStartModal(examId) {
  const exam = exams.find(x => x.id === examId);
  if (!exam || !exam.questions.length) return;
  modalExamId = examId;
  modalMode = 'exam';

  document.getElementById('modal-exam-title').textContent = exam.title;
  document.getElementById('exam-time').value = exam.timeLimit || 0;
  document.getElementById('cluster-size').value = 5;
  document.getElementById('exam-mode-desc').textContent =
    exam.timeLimit
      ? `Timed (${exam.timeLimit} min by default — can change below) · all questions at once · results saved`
      : 'Timed (no limit by default — can set below) · all questions at once · results saved';

  selectMode('exam');
  selectOrder('forward');
  syncClusterChips();
  document.getElementById('start-modal').style.display = 'flex';
}

function closeStartModal() {
  document.getElementById('start-modal').style.display = 'none';
}

function selectMode(mode) {
  modalMode = mode;
  document.querySelectorAll('.mode-option').forEach(el => {
    const on = el.dataset.mode === mode;
    el.classList.toggle('selected', on);
    const radio = el.querySelector('input');
    if (radio) radio.checked = on;
  });
  document.getElementById('exam-options').style.display = mode === 'exam' ? 'block' : 'none';
  document.getElementById('practice-options').style.display = mode === 'practice' ? 'block' : 'none';
}

function selectOrder(order) {
  modalOrder = order;
  document.querySelectorAll('.chip[data-order]').forEach(c => {
    c.classList.toggle('active', c.dataset.order === order);
  });
}

function setClusterSize(n, btn) {
  document.getElementById('cluster-size').value = n;
  document.querySelectorAll('.chip[data-size]').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function syncClusterChips() {
  const v = parseInt(document.getElementById('cluster-size').value) || 5;
  document.getElementById('cluster-size').value = Math.max(1, v);
  const val = Math.max(1, v);
  document.querySelectorAll('.chip[data-size]').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.size) === val);
  });
}

function confirmStart() {
  const exam = exams.find(x => x.id === modalExamId);
  if (!exam) return;

  /* Build ordered question list according to selected order */
  let questions = exam.questions.slice();
  if (modalOrder === 'reverse') questions = questions.slice().reverse();
  else if (modalOrder === 'random') questions = shuffle(questions);

  const total = questions.length;

  const runObj = {
    examId: exam.id,
    mode: modalMode,
    order: modalOrder,
    questions: questions,             // ordered copy used throughout the run
    answers: new Array(total).fill(null),
    startedAt: Date.now(),
    index: 0
  };

  if (modalMode === 'exam') {
    const timeLimit = Math.max(0, parseInt(document.getElementById('exam-time').value) || 0);
    runObj.endsAt = timeLimit ? Date.now() + timeLimit * 60000 : 0;
  } else {
    const clusterSize = Math.max(1, parseInt(document.getElementById('cluster-size').value) || 5);
    runObj.clusterSize = Math.min(clusterSize, total);
    const clusterCount = Math.ceil(total / runObj.clusterSize);
    runObj.clusterSubmitted = new Array(clusterCount).fill(false);
  }

  run = runObj;
  closeStartModal();
  view = modalMode === 'exam' ? 'quiz' : 'practice';
  render();
  if (run.endsAt) startTimer();
}

/* =========================================================
   CSV
   ========================================================= */
function parseCSV(text) {
  const delim = detectDelimiter(text);
  const rows = [];
  let row = [], field = '', inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delim) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function detectDelimiter(text) {
  const firstLine = text.split(/\r?\n/)[0] || '';
  let commas = 0, tabs = 0;
  let inQ = false;
  for (const c of firstLine) {
    if (c === '"') inQ = !inQ;
    else if (!inQ && c === ',') commas++;
    else if (!inQ && c === '\t') tabs++;
  }
  return tabs > commas ? '\t' : ',';
}

function resolveAnswer(raw, options) {
  const s = String(raw || '').trim();
  if (/^[1-9]$/.test(s)) {
    const n = parseInt(s, 10) - 1;
    return n < options.length ? n : -1;
  }
  if (/^[a-dA-D]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  const idx = options.findIndex(o => o.trim().toLowerCase() === s.toLowerCase());
  return idx;
}

function importCSV() {
  const ta = document.getElementById('csv-text');
  const text = ta.value;
  if (!text.trim()) { alert('Please paste CSV data first.'); return; }

  const rows = parseCSV(text);
  if (!rows.length) { alert('No data found in the pasted text.'); return; }

  let start = 0;
  const h = rows[0].map(c => c.trim().toLowerCase());
  if (h[0] === 'question' || h[0] === 'câu hỏi' || h[5] === 'answer' || h[5] === 'đáp án') start = 1;

  let ok = 0;
  const bad = [];

  for (let r = start; r < rows.length; r++) {
    const row = rows[r].slice();
    while (row.length < 7) row.push('');

    const qText = row[0].trim();
    const options = [row[1], row[2], row[3], row[4]].map(s => (s || '').trim());
    const ans = resolveAnswer(row[5], options);
    const explanation = (row[6] || '').trim();

    if (!qText || options.filter(Boolean).length < 2 || ans < 0 || !options[ans]) {
      bad.push(r + 1);
      continue;
    }
    draft.questions.push({ id: uid(), text: qText, options, answer: ans, explanation });
    ok++;
  }

  let msg = `Imported ${ok} question${ok !== 1 ? 's' : ''}.`;
  if (bad.length) msg += `\n\nSkipped ${bad.length} invalid row${bad.length !== 1 ? 's' : ''} (line ${bad.join(', ')}).`;
  alert(msg);

  if (ok) { ta.value = ''; render(true); }
}

function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadFile(filename, content) {
  const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

function downloadTemplate() {
  const csv = [
    'Question,Option 1,Option 2,Option 3,Option 4,Answer,Explanation',
    '"What is the capital of France?","Paris","London","Berlin","Madrid","1","Paris is the capital and largest city of France."',
    '"Which language runs in a web browser?","Java","C","JavaScript","Python","C","JavaScript is the standard scripting language of the web."'
  ].join('\n');
  downloadFile('quiz-template.csv', csv);
}

function exportCSV() {
  const lines = ['Question,Option 1,Option 2,Option 3,Option 4,Answer,Explanation'];
  draft.questions.forEach(q => {
    lines.push([q.text, ...q.options, String(q.answer + 1), q.explanation || ''].map(csvCell).join(','));
  });
  const name = (draft.title || 'exam').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  downloadFile(name + '.csv', lines.join('\n'));
}

/* =========================================================
   EXAM MODE RUN
   ========================================================= */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (view !== 'quiz' || !run) { clearInterval(timerId); return; }
    const left = run.endsAt - Date.now();
    const el = document.getElementById('timer');
    if (el) {
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 60000);
    }
    if (left <= 0) { clearInterval(timerId); submitQuiz(true); }
  }, 250);
}

function quizHTML() {
  const exam = exams.find(x => x.id === run.examId);
  const questions = run.questions;
  const total = questions.length;
  const q = questions[run.index];
  const answered = run.answers.filter(a => a !== null).length;
  const sel = run.answers[run.index];

  return `
  <div class="quiz-head">
    <div>
      <h1 class="h1">${esc(exam.title)}</h1>
      <div class="muted">Question ${run.index + 1} of ${total} · ${answered} answered</div>
    </div>
    <div class="row">
      ${run.endsAt ? `<div class="timer" id="timer">${fmtTime(run.endsAt - Date.now())}</div>`
                   : `<span class="muted">No time limit</span>`}
      <button class="btn" onclick="exitQuiz()">Exit</button>
    </div>
  </div>

  <div class="quiz-layout">
    <div class="card question-card">
      <div class="q-index">Question ${run.index + 1}</div>
      <p class="q-text">${esc(q.text)}</p>
      <div class="options">
        ${q.options.map((o, i) => o ? `
          <button class="option ${sel === i ? 'selected' : ''}" onclick="pick(${i})">
            <span class="letter">${'ABCD'[i]}</span>
            <span>${esc(o)}</span>
          </button>` : '').join('')}
      </div>
      <div class="nav-row">
        <button class="btn" onclick="prevQ()" ${run.index === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="btn" onclick="clearQ()" ${sel === null ? 'disabled' : ''}>Clear</button>
        ${run.index < total - 1
          ? `<button class="btn primary" onclick="nextQ()">Next →</button>`
          : `<button class="btn primary" onclick="submitQuiz()">Submit Quiz</button>`}
      </div>
    </div>

    <div class="card">
      <h3>Questions</h3>
      <div class="palette">
        ${questions.map((_, i) => `
          <button class="pal ${i === run.index ? 'current' : ''} ${run.answers[i] !== null ? 'answered' : ''}"
                  onclick="goQ(${i})">${i + 1}</button>`).join('')}
      </div>
      <button class="btn primary block" onclick="submitQuiz()">Submit Quiz</button>
    </div>
  </div>`;
}

function pick(i)      { run.answers[run.index] = i; render(true); }
function clearQ()     { run.answers[run.index] = null; render(true); }
function goQ(i)       { run.index = i; render(); }
function prevQ()      { if (run.index > 0) { run.index--; render(); } }
function nextQ()      { if (run.index < run.answers.length - 1) { run.index++; render(); } }

function exitQuiz() {
  if (!confirm('Exit the quiz? Your progress will be lost.')) return;
  clearInterval(timerId);
  run = null; view = 'list'; render();
}

function submitQuiz(auto) {
  if (!auto) {
    const un = run.answers.filter(a => a === null).length;
    if (un > 0 && !confirm(`You have ${un} unanswered question${un !== 1 ? 's' : ''}. Submit anyway?`)) return;
  }
  clearInterval(timerId);

  const exam = exams.find(x => x.id === run.examId);
  const questions = run.questions;
  const total = questions.length;
  const correct = questions.reduce((n, q, i) => n + (run.answers[i] === q.answer ? 1 : 0), 0);
  const score = total ? Math.round((correct / total) * 100) : 0;

  const attempt = {
    id: uid(),
    date: new Date().toISOString(),
    correct, total, score,
    durationSec: Math.round((Date.now() - run.startedAt) / 1000),
    answers: run.answers.slice(),
    questions: JSON.parse(JSON.stringify(questions)),
    mode: 'exam',
    order: run.order
  };

  exam.attempts = exam.attempts || [];
  exam.attempts.push(attempt);
  save();

  lastResult = { exam, attempt };
  run = null;
  view = 'result';
  render();
  if (auto) toast('⏰ Time is up — quiz submitted automatically');
}

/* =========================================================
   PRACTICE MODE RUN
   ========================================================= */
function practiceHTML() {
  const exam = exams.find(x => x.id === run.examId);
  const questions = run.questions;
  const total = questions.length;
  const size = run.clusterSize;
  const clusterCount = Math.ceil(total / size);
  const clusterIndex = Math.floor(run.index / size);
  const start = clusterIndex * size;
  const end = Math.min(start + size, total);
  const clusterTotal = end - start;
  const submitted = !!run.clusterSubmitted[clusterIndex];
  const q = questions[run.index];
  const sel = run.answers[run.index];

  let answeredInCluster = 0;
  for (let i = start; i < end; i++) if (run.answers[i] !== null) answeredInCluster++;
  const allAnswered = answeredInCluster === clusterTotal;
  const allSubmitted = run.clusterSubmitted.every(Boolean);

  /* cluster tabs */
  const clusterTabs = [];
  for (let c = 0; c < clusterCount; c++) {
    const cStart = c * size;
    const cEnd = Math.min(cStart + size, total);
    const cSub = run.clusterSubmitted[c];
    let cls = 'cluster-tab';
    if (cSub) cls += ' done';
    if (c === clusterIndex) cls += ' active';
    clusterTabs.push(
      `<button class="${cls}" onclick="goCluster(${c})">Cluster ${c + 1} <span style="opacity:.7">(${cStart + 1}–${cEnd})</span></button>`
    );
  }

  /* question palette within current cluster */
  const palette = [];
  for (let i = start; i < end; i++) {
    const num = i - start + 1;
    let cls = 'pal';
    if (i === run.index) cls += ' current';
    if (run.answers[i] !== null) cls += ' answered';
    if (run.clusterSubmitted[clusterIndex]) cls += ' submitted';
    palette.push(`<button class="${cls}" onclick="goQPractice(${i})">${num}</button>`);
  }

  /* options */
  let optionsHTML = '';
  if (submitted) {
    optionsHTML = q.options.map((o, j) => {
      if (!o) return '';
      const isCorrect = j === q.answer;
      const isChosen = j === sel;
      const cls = isCorrect ? 'correct' : (isChosen ? 'wrong' : '');
      return `
        <div class="ropt ${cls}">
          <span class="letter">${'ABCD'[j]}</span>
          <span>${esc(o)}</span>
          ${isCorrect ? '<span class="tag">Correct answer</span>' : ''}
          ${(isChosen && !isCorrect) ? '<span class="tag bad">Your answer</span>' : ''}
        </div>`;
    }).join('');
  } else {
    optionsHTML = q.options.map((o, j) => {
      if (!o) return '';
      return `
        <button class="option ${sel === j ? 'selected' : ''}" onclick="pickPractice(${j})">
          <span class="letter">${'ABCD'[j]}</span>
          <span>${esc(o)}</span>
        </button>`;
    }).join('');
  }

  /* status chip */
  let statusChip = '';
  if (submitted) {
    const ok = sel === q.answer;
    statusChip = `<div style="margin-bottom:12px">
      <span class="badge ${ok ? 'ok' : 'bad'}">${ok ? '✓ Correct' : '✗ Incorrect'}</span>
      ${sel === null ? '<span class="badge bad" style="margin-left:6px">Not answered</span>' : ''}
    </div>`;
  }

  return `
  <div class="quiz-head">
    <div>
      <h1 class="h1">${esc(exam.title)} <span class="badge mode" style="vertical-align:middle;margin-left:6px">Practice</span></h1>
      <div class="muted">Cluster ${clusterIndex + 1} of ${clusterCount} · Question ${run.index - start + 1} of ${clusterTotal} in cluster</div>
    </div>
    <div class="row">
      ${allSubmitted ? `<button class="btn primary" onclick="finishPractice()">Finish practice →</button>` : ''}
      <button class="btn" onclick="exitPractice()">Exit</button>
    </div>
  </div>

  <div class="quiz-layout">
    <div class="card question-card">
      <div class="q-index">Cluster ${clusterIndex + 1} · Question ${run.index - start + 1}</div>
      <p class="q-text">${esc(q.text)}</p>
      ${statusChip}
      <div class="options">${optionsHTML}</div>
      ${submitted && q.explanation ? `<div class="explain"><strong>Explanation:</strong> ${esc(q.explanation)}</div>` : ''}

      <div class="nav-row">
        <button class="btn" onclick="prevPractice()" ${run.index === start ? 'disabled' : ''}>← Previous</button>
        ${!submitted && sel !== null ? `<button class="btn" onclick="clearPractice()">Clear</button>` : ''}
        ${run.index < end - 1 ? `<button class="btn" onclick="nextPractice()">Next →</button>` : ''}
        ${!submitted
          ? `<button class="btn primary" onclick="checkCluster()" ${allAnswered ? '' : 'disabled'}
               title="${allAnswered ? '' : 'Answer all questions in this cluster first'}">
               ${allAnswered ? '✓ Check cluster answers' : `Answer all ${clusterTotal} to check`}
             </button>`
          : (clusterIndex < clusterCount - 1
              ? `<button class="btn primary" onclick="nextCluster()">Next cluster →</button>`
              : `<button class="btn primary" onclick="finishPractice()">Finish practice →</button>`)
        }
      </div>
    </div>

    <div class="card">
      <h3>Questions in this cluster</h3>
      <div class="palette">${palette.join('')}</div>
      <div class="muted" style="margin-bottom:10px">${answeredInCluster}/${clusterTotal} answered${submitted ? ' · cluster checked ✓' : ''}</div>
      ${!submitted
        ? `<button class="btn primary block" onclick="checkCluster()" ${allAnswered ? '' : 'disabled'}>
             ${allAnswered ? 'Check cluster answers' : 'Answer all questions to check'}
           </button>`
        : `<div class="muted" style="text-align:center;padding:6px">Answers revealed for this cluster</div>`}
    </div>
  </div>
  
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:10px">Clusters</h3>
    <div class="cluster-tabs">${clusterTabs.join('')}</div>
  </div>
  `;
}

/* ----- practice navigation ----- */
function goCluster(c) {
  run.index = c * run.clusterSize;
  render();
}

function goQPractice(globalIdx) {
  run.index = globalIdx;
  render();
}

function prevPractice() {
  const clusterIndex = Math.floor(run.index / run.clusterSize);
  const start = clusterIndex * run.clusterSize;
  if (run.index > start) { run.index--; render(); }
}

function nextPractice() {
  const total = run.questions.length;
  const clusterIndex = Math.floor(run.index / run.clusterSize);
  const end = Math.min((clusterIndex + 1) * run.clusterSize, total);
  if (run.index < end - 1) { run.index++; render(); }
}

function pickPractice(j) {
  const clusterIndex = Math.floor(run.index / run.clusterSize);
  if (run.clusterSubmitted[clusterIndex]) return;
  run.answers[run.index] = j;
  render(true);
}

function clearPractice() {
  const clusterIndex = Math.floor(run.index / run.clusterSize);
  if (run.clusterSubmitted[clusterIndex]) return;
  run.answers[run.index] = null;
  render(true);
}

function checkCluster() {
  const total = run.questions.length;
  const size = run.clusterSize;
  const clusterIndex = Math.floor(run.index / size);
  const start = clusterIndex * size;
  const end = Math.min(start + size, total);

  for (let i = start; i < end; i++) {
    if (run.answers[i] === null) {
      alert('Please answer all questions in this cluster first.');
      return;
    }
  }

  run.clusterSubmitted[clusterIndex] = true;
  render();
}

function nextCluster() {
  const size = run.clusterSize;
  const clusterIndex = Math.floor(run.index / size);
  run.index = (clusterIndex + 1) * size;
  render();
}

function finishPractice() {
  const exam = exams.find(x => x.id === run.examId);
  const questions = run.questions;
  const total = questions.length;

  const allSubmitted = run.clusterSubmitted.every(Boolean);
  if (!allSubmitted) {
    if (!confirm('Not all clusters are checked yet. Finish practice anyway?')) return;
  }

  const correct = questions.reduce((n, q, i) => n + (run.answers[i] === q.answer ? 1 : 0), 0);
  const score = total ? Math.round((correct / total) * 100) : 0;

  const attempt = {
    id: uid(),
    date: new Date().toISOString(),
    correct, total, score,
    durationSec: Math.round((Date.now() - run.startedAt) / 1000),
    answers: run.answers.slice(),
    questions: JSON.parse(JSON.stringify(questions)),
    mode: 'practice',
    order: run.order
  };

  exam.attempts = exam.attempts || [];
  exam.attempts.push(attempt);
  save();

  lastResult = { exam, attempt };
  run = null;
  view = 'result';
  render();
}

function exitPractice() {
  if (!confirm('Exit practice? Your progress will be lost.')) return;
  run = null; view = 'list'; render();
}

/* =========================================================
   VIEW: RESULT
   ========================================================= */
function resultHTML() {
  const { exam, attempt } = lastResult;
  const pass = attempt.score >= 50;
  const isPractice = attempt.mode === 'practice';

  const review = attempt.questions.map((q, i) => {
    const sel = attempt.answers[i];
    const ok = sel === q.answer;

    const opts = q.options.map((o, j) => {
      if (!o) return '';
      const isCorrect = j === q.answer;
      const isChosen = j === sel;
      const cls = isCorrect ? 'correct' : (isChosen ? 'wrong' : '');
      return `
        <div class="ropt ${cls}">
          <span class="letter">${'ABCD'[j]}</span>
          <span>${esc(o)}</span>
          ${isCorrect ? '<span class="tag">Correct answer</span>' : ''}
          ${(isChosen && !isCorrect) ? '<span class="tag bad">Your answer</span>' : ''}
        </div>`;
    }).join('');

    return `
      <div class="card review ${ok ? 'ok' : 'bad'}">
        <div class="review-head">
          <span class="badge ${ok ? 'ok' : 'bad'}">${ok ? 'Correct' : 'Incorrect'}</span>
          <span class="muted">Question ${i + 1}</span>
          ${sel === null ? '<span class="muted">· Not answered</span>' : ''}
        </div>
        <p class="q-text">${esc(q.text)}</p>
        ${opts}
        ${q.explanation ? `<div class="explain"><strong>Explanation:</strong> ${esc(q.explanation)}</div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="page-head">
      <div>
        <h1 class="h1">
          ${esc(exam.title)} — Results
          <span class="badge mode" style="vertical-align:middle;margin-left:6px">${isPractice ? 'Practice' : 'Exam'}</span>
          ${attempt.order && attempt.order !== 'forward'
            ? `<span class="badge mode" style="vertical-align:middle;margin-left:6px">${attempt.order === 'random' ? 'Random' : 'Reverse'}</span>`
            : ''}
        </h1>
        <div class="muted">${fmtDate(attempt.date)}</div>
      </div>
      <div class="row">
        <button class="btn" onclick="goHome()">Back to exams</button>
        <button class="btn primary" onclick="retake('${exam.id}')">Retake</button>
      </div>
    </div>

    <div class="card score-hero">
      <div class="score-big ${pass ? 'pass' : 'fail'}">${attempt.score}%</div>
      <div class="score-sub">${attempt.correct} of ${attempt.total} correct</div>
      <div class="stat-row">
        <div class="stat"><b>${attempt.correct}</b><span>Correct</span></div>
        <div class="stat"><b>${attempt.total - attempt.correct}</b><span>Wrong</span></div>
        <div class="stat"><b>${fmtTime(attempt.durationSec * 1000)}</b><span>Time taken</span></div>
      </div>
    </div>

    <h3 style="margin:22px 0 12px">Answer review</h3>
    ${review}`;
}

function retake(id) {
  openStartModal(id);
}

/* =========================================================
   BOOT
   ========================================================= */
let initialTheme = 'dark';
try { initialTheme = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e) {}
applyTheme(initialTheme);

load();
render();
</script>
</body>
