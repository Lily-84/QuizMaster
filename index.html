<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Quiz Practice</title>
<style>
/* ============================== THEME ============================== */
:root{
  color-scheme: dark;
  --bg:#0d1017; --panel:#151a23; --panel-2:#1b2230; --panel-3:#222a3a;
  --border:#2a3346; --text:#e8ecf4; --muted:#93a0b8;
  --accent:#5b8cff; --accent-soft:rgba(91,140,255,.16);
  --green:#34d399; --green-soft:rgba(52,211,153,.14);
  --red:#f87171;  --red-soft:rgba(248,113,113,.14);
  --yellow:#fbbf24; --yellow-soft:rgba(251,191,36,.16);
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.4);
}
[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f7f9fd; --panel-3:#eef2f9;
  --border:#dde3ee; --text:#101828; --muted:#64748b;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --green:#059669; --green-soft:rgba(5,150,105,.10);
  --red:#dc2626;   --red-soft:rgba(220,38,38,.10);
  --yellow:#b45309; --yellow-soft:rgba(180,83,9,.12);
  --shadow:0 10px 30px rgba(16,24,40,.10);
}

/* ============================== BASE ============================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    "Noto Sans","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none !important}
.muted{color:var(--muted)}
.spacer{flex:1}

/* ============================== TOPBAR ============================== */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--border);
}
body[data-screen="quiz"] .topbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;user-select:none}
.brand span{font-size:15px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);cursor:pointer;font-size:16px;
  transition:background .15s,transform .1s;
}
.icon-btn:hover{background:var(--panel-3)}
.icon-btn:active{transform:scale(.94)}

#main{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
body[data-screen="quiz"] #main{padding-top:0}
@media(max-width:820px){#main{padding:14px 12px 90px}}

/* ============================== HOME ============================== */
.page-head{margin-bottom:16px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}

.search-row{margin:14px 0 18px}
.search{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:15px;outline:none;
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- File-explorer tree ---------- */
.tree-root{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px}
.tree-children{padding-left:18px;margin-left:10px;border-left:1px dashed var(--border)}
.tree-folder{margin:1px 0}
.tree-folder-head{
  display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;
  font-weight:700;list-style:none;user-select:none;border-radius:8px;
  font-size:14px;transition:background .12s;
}
.tree-folder-head::-webkit-details-marker{display:none}
.tree-folder-head::before{
  content:"▸";display:inline-block;color:var(--muted);font-size:11px;
  transition:transform .18s;width:12px;flex:0 0 12px;
}
.tree-folder[open] > .tree-folder-head::before{transform:rotate(90deg)}
.tree-folder-head:hover{background:var(--panel-2)}
.folder-icon{font-size:14px;line-height:1}
.folder-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
.count{
  font-size:11.5px;font-weight:700;color:var(--muted);
  background:var(--panel-3);border-radius:99px;padding:1px 8px;
}
.test-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;background:none;border:0;cursor:pointer;
  border-radius:8px;transition:background .12s;font-size:14px;
}
.test-row:hover{background:var(--panel-2)}
.test-icon{font-size:14px;line-height:1}
.test-info{flex:1;min-width:0}
.test-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-meta{font-size:12px;color:var(--muted);margin-top:1px}
.chev{color:var(--muted);font-size:19px;line-height:1}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}

/* ============================== BUTTONS / INPUTS ============================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel-2);cursor:pointer;font-weight:600;font-size:14px;
  transition:background .15s,transform .1s,border-color .15s;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.block{width:100%}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:14.5px;outline:none;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:150px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}

/* ============================== SETUP ============================== */
.setup-title{font-size:20px;font-weight:800;margin-bottom:2px;word-break:break-word}
.setup-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.resume-card{
  border:1px solid var(--accent);background:var(--accent-soft);
  border-radius:12px;padding:14px;margin-bottom:16px;
}
.resume-card p{font-size:13.5px;margin-bottom:10px}

/* ============================== QUIZ ============================== */
.quiz-header{
  position:sticky;top:0;z-index:55;
  background:var(--bg);
  padding:10px 0 0;
  margin-bottom:14px;
}
.quiz-bar-top{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.quiz-bar-title{flex:1;min-width:0}
.qt-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-sub{font-size:12px;color:var(--muted)}
.timer{
  font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
  padding:7px 12px;border-radius:10px;background:var(--panel-2);
  border:1px solid var(--border);white-space:nowrap;
}
.timer.danger{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.progress{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}

.quiz-layout{display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start}
.question-list{display:flex;flex-direction:column;gap:14px}

.q-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;scroll-margin-top:100px;
}
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.q-index{font-size:13px;font-weight:800;color:var(--accent);
  text-transform:uppercase;letter-spacing:.6px}
.q-actions{display:flex;gap:8px;margin-left:auto}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:99px;border:1px solid var(--border);
  background:var(--panel-2);font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.chip:hover{background:var(--panel-3)}
.chip.on{background:var(--yellow-soft);border-color:var(--yellow);color:var(--yellow)}

.q-text{font-size:16px;line-height:1.7;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.q-image{display:block;max-height:320px;margin:0 0 14px;border-radius:10px;border:1px solid var(--border)}

.options{display:flex;flex-direction:column;gap:9px}
.option{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--panel-2);cursor:pointer;transition:all .15s;font-size:14.5px;
}
.option:hover{border-color:var(--accent);background:var(--panel-3)}
.option.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt-key{
  flex:0 0 24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;background:var(--panel-3);font-size:12px;font-weight:800;color:var(--muted);
}
.option.selected .opt-key{background:var(--accent);color:#fff}
.opt-text{flex:1;word-break:break-word}

.note-panel{margin-top:14px}
.note-area{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font:inherit;font-size:14px;
  resize:vertical;outline:none;
}
.note-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.quiz-side{
  position:sticky;top:84px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
}
.side-title{font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.p-item{
  aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);
  background:var(--panel-2);cursor:pointer;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:all .13s;
}
.p-item:hover{border-color:var(--accent)}
.p-item.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.p-item.flagged{box-shadow:inset 0 0 0 2px var(--yellow)}
.p-item.current{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:4px;border:1.5px solid var(--border);display:inline-block}
.dot.answered{background:var(--accent-soft);border-color:var(--accent)}
.dot.current{outline:2px solid var(--accent);outline-offset:1px}
.dot.flagged{box-shadow:inset 0 0 0 2px var(--yellow)}

.only-mobile{display:none}

/* ============================== RESULT ============================== */
.result-hero{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;margin-bottom:16px;
}
.score-big{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1.1}
.score-big.pass{color:var(--green)}
.score-big.fail{color:var(--red)}
.score-sub{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--panel-2);border:1px solid var(--border);border-radius:11px;
  padding:9px 15px;min-width:96px}
.stat b{display:block;font-size:17px}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{
  padding:7px 14px;border-radius:99px;border:1px solid var(--border);
  background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;
}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.review-item{
  background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:12px;
}
.review-item.ok{border-left-color:var(--green)}
.review-item.bad{border-left-color:var(--red)}
.review-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.4px}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.review-qno{font-size:12.5px;font-weight:700;color:var(--muted)}
.review-q{font-size:15.5px;line-height:1.65;margin-bottom:11px;white-space:pre-wrap;word-break:break-word}
.review-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ropt{display:flex;gap:9px;padding:9px 12px;border-radius:9px;font-size:14px;
  border:1px solid var(--border);background:var(--panel-2);word-break:break-word}
.ropt .k{font-weight:800;color:var(--muted);flex:0 0 16px}
.ropt.correct{background:var(--green-soft);border-color:var(--green)}
.ropt.correct .k{color:var(--green)}
.ropt.chosen-wrong{background:var(--red-soft);border-color:var(--red)}
.ropt.chosen-wrong .k{color:var(--red)}
.review-note{
  font-size:13px;color:var(--muted);background:var(--yellow-soft);
  border-radius:9px;padding:8px 12px;margin-bottom:10px;white-space:pre-wrap;
}
.explain{
  margin-top:10px;padding:12px 14px;border-radius:10px;
  background:var(--panel-2);border:1px dashed var(--border);
  font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}

/* ============================== MISC ============================== */
.error-card{text-align:center}
.error-card h2{margin-bottom:8px}
.code{
  background:var(--panel-3);border-radius:9px;padding:12px;margin:14px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  overflow-x:auto;text-align:left;
}
.spinner{
  width:34px;height:34px;border-radius:50%;margin:60px auto 14px;
  border:3px solid var(--border);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--muted);font-size:14px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--panel-3);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;z-index:200;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================== MOBILE ============================== */
@media(max-width:820px){
  .quiz-layout{grid-template-columns:1fr}
  .quiz-side{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:90;
    max-height:70vh;overflow:auto;border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .25s ease;
    box-shadow:var(--shadow);border-bottom:0;
  }
  .quiz-side.open{transform:none}
  .only-mobile{display:inline-flex}
  .score-big{font-size:36px}
  .page-title{font-size:20px}
  .q-card{scroll-margin-top:80px}
}
@media(max-width:520px){
  .qt-sub{display:none}
  .quiz-bar-top{gap:6px}
  .quiz-bar-top .btn.primary{padding:8px 11px;font-size:13px}
  .timer{font-size:13px;padding:6px 9px}
  .tree-folder-head{font-size:13.5px}
  .test-name{font-size:13.5px}
}
</style>
</head>
<body data-screen="home">

<header class="topbar">
  <div class="brand" id="brandBtn" role="button" tabindex="0">📚 <span>Quiz Practice</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" title="Toggle dark / light mode">🌙</button>
</header>

<main id="main"></main>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* ==================================================================
   1. CONFIGURATION
   ================================================================== */
const CONFIG = {
  catalogFile: 'data.csv',
  catalogColumns: { name: 'Test', link: 'DataLink' },
  questionColumns: {
    text:    'Question',
    answer:  'Answer',
    explain: 'Explain',
    image:   'ImageLink',
    optionPattern: /^opt(?:ion)?[\s_-]*(\d+)$/i
  },
  /* Các giá trị được coi là "không có ảnh" — sẽ bị bỏ qua hoàn toàn */
  imagePlaceholders: ['', '-', '—', '–', 'n/a', 'na', 'none', 'null', 'nil', 'なし', '無し', '無', '0'],
  defaultFolder: 'General',
  passRatio: 0.7,
  defaultTimeMin: 0,
  storagePrefix: 'quizapp.v2.',
  autosaveDebounceMs: 250
};

/* ==================================================================
   2. TINY HELPERS
   ================================================================== */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function h(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected' || k === 'open') node[k] = v;
    else node.setAttribute(k, v);
  }
  appendKids(node, kids);
  return node;
}
function appendKids(node, kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false || kid === true) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtTime(totalSec) {
  const sec = Math.max(0, Math.floor(totalSec));
  const hh = Math.floor(sec / 3600);
  const mm = Math.floor((sec % 3600) / 60);
  const ss = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return hh > 0 ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
}
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ==================================================================
   3. CSV PARSING
   ================================================================== */
function parseCSV(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else if (ch !== '\r') {
      field += ch;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function rowsToObjects(rows) {
  if (rows.length < 2) return [];
  const header = rows[0].map(s => String(s).trim());
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((key, i) => { if (key) obj[key] = String(r[i] ?? '').trim(); });
    return obj;
  });
}

function pick(obj, ...names) {
  if (!obj) return '';
  const keys = Object.keys(obj);
  for (const name of names) {
    const target = String(name).toLowerCase();
    const k = keys.find(key => key.trim().toLowerCase() === target);
    if (k !== undefined && obj[k] !== '') return obj[k];
  }
  return '';
}

/* Trả về '' nếu giá trị là placeholder; ngược lại trả về chuỗi đã trim. */
function cleanImage(raw) {
  const s = String(raw ?? '').trim();
  if (!s) return '';
  const lower = s.toLowerCase();
  if (CONFIG.imagePlaceholders.some(p => p && lower === p)) return '';
  return s;
}

function splitPath(p) {
  const parts = String(p).split(/[\\/]+/).filter(Boolean);
  if (parts.length <= 1) return { folderParts: [], shortName: parts[0] || 'Untitled' };
  return {
    folderParts: parts.slice(0, -1),
    shortName: parts[parts.length - 1]
  };
}

function parseAnswer(raw, options) {
  const s = String(raw).trim();
  if (!s) return -1;
  if (/^\d+$/.test(s)) {
    const n = parseInt(s, 10);
    if (n >= 1 && n <= options.length) return n - 1;
    if (n >= 0 && n < options.length) return n;
    return -1;
  }
  if (/^[A-Za-z]$/.test(s)) {
    const idx = s.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx < options.length) return idx;
  }
  return options.findIndex(o => o.trim() === s);
}

/* ==================================================================
   4. STORAGE
   ================================================================== */
const store = {
  key: k => CONFIG.storagePrefix + k,
  get(k, fallback) {
    try {
      const raw = localStorage.getItem(store.key(k));
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(k, v) {
    try { localStorage.setItem(store.key(k), JSON.stringify(v)); } catch {}
  },
  del(k) {
    try { localStorage.removeItem(store.key(k)); } catch {}
  }
};

/* ==================================================================
   6. DATA LOADING
   ================================================================== */
async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to load "${url}" (HTTP ${res.status})`);
  return await res.text();
}

async function loadCatalog() {
  const rows = rowsToObjects(parseCSV(await fetchText(CONFIG.catalogFile)));
  const tests = [];
  const seen = new Set();

  for (const row of rows) {
    const name = pick(row, CONFIG.catalogColumns.name, 'Test', 'Name', 'Title');
    const link = pick(row, CONFIG.catalogColumns.link, 'DataLink', 'Link', 'File', 'Path', 'Url');
    if (!link) continue;
    const id = name || link;
    if (seen.has(id)) continue;
    seen.add(id);

    const { folderParts, shortName } = splitPath(name || link);
    tests.push({
      id,
      name: shortName,
      folderParts,
      folder: folderParts.length ? folderParts.join(' / ') : CONFIG.defaultFolder,
      path: name || link,
      link
    });
  }
  return tests;
}

async function loadQuestions(test) {
  const rows = rowsToObjects(parseCSV(await fetchText(test.link)));
  const baseUrl = new URL(test.link, location.href);
  const out = [];

  for (const row of rows) {
    const text = pick(row, CONFIG.questionColumns.text, 'Question', 'Q', 'Text', 'Prompt');
    if (!text) continue;

    const found = [];
    for (const key of Object.keys(row)) {
      const m = key.match(CONFIG.questionColumns.optionPattern);
      if (m) found.push({ key, n: parseInt(m[1], 10) });
    }
    found.sort((a, b) => a.n - b.n);
    const options = found.map(o => row[o.key]).filter(v => v !== '');
    if (options.length < 2) continue;

    const answerRaw = pick(row, CONFIG.questionColumns.answer, 'Answer', 'Correct', 'Key', 'Ans');
    const answerIndex = parseAnswer(answerRaw, options);

    /* Ảnh: chỉ nhận nếu không phải placeholder; bỏ qua hoàn toàn nếu trống */
    const imgRaw = cleanImage(pick(row, CONFIG.questionColumns.image, 'ImageLink', 'Image', 'Img', 'Picture'));
    let image = '';
    if (imgRaw) {
      try { image = new URL(imgRaw, baseUrl).href; } catch { image = imgRaw; }
    }

    out.push({
      text,
      options,
      answerIndex,
      image,
      explain: pick(row, CONFIG.questionColumns.explain, 'Explain', 'Explanation', 'Note', 'Comment')
    });
  }
  return out;
}

/* ==================================================================
   9. FOLDER TREE BUILD
   ================================================================== */
function buildTree(tests) {
  const root = { type: 'folder', name: '', path: '', children: new Map() };
  for (const test of tests) {
    let node = root;
    for (const part of test.folderParts) {
      if (!node.children.has(part)) {
        node.children.set(part, {
          type: 'folder',
          name: part,
          path: (node.path ? node.path + '/' : '') + part,
          children: new Map()
        });
      }
      node = node.children.get(part);
    }
    node.children.set(test.name, { type: 'test', name: test.name, test });
  }
  return root;
}

function countTests(node) {
  let n = 0;
  for (const child of node.children.values()) {
    if (child.type === 'test') n++;
    else n += countTests(child);
  }
  return n;
}

function renderTree(node, depth = 0, forceOpen = false) {
  const container = h('div', { class: depth === 0 ? 'tree-root' : 'tree-children' });

  const folders = [];
  const tests = [];
  for (const child of node.children.values()) {
    if (child.type === 'folder') folders.push(child);
    else tests.push(child);
  }
  folders.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  tests.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  for (const folder of folders) {
    /* Mặc định thu gọn; chỉ mở khi đang search (forceOpen=true) */
    container.append(
      h('details', { class: 'tree-folder', open: forceOpen },
        h('summary', { class: 'tree-folder-head' },
          h('span', { class: 'folder-icon' }, '📁'),
          h('span', { class: 'folder-name' }, folder.name),
          h('span', { class: 'count' }, String(countTests(folder)))
        ),
        renderTree(folder, depth + 1, forceOpen)
      )
    );
  }
  for (const t of tests) {
    container.append(testRow(t.test));
  }
  return container;
}

/* ==================================================================
   14. SESSION LIFECYCLE
   ================================================================== */
const sessionKey = id => 'session.' + encodeURIComponent(id);

function shuffleOptionsOf(q) {
  if (q.answerIndex < 0 || q.answerIndex >= q.options.length) return q;
  const tagged = q.options.map((text, i) => ({ text, ok: i === q.answerIndex }));
  const mixed = shuffle(tagged);
  return { ...q, options: mixed.map(x => x.text), answerIndex: mixed.findIndex(x => x.ok) };
}

function startSession(test, questions, opts) {
  let qs = questions.map(q => ({ ...q, options: q.options.slice() }));
  if (opts.shuffleQuestions) qs = shuffle(qs);
  qs = qs.slice(0, Math.min(opts.count || qs.length, qs.length));
  if (opts.shuffleOptions) qs = qs.map(shuffleOptionsOf);

  state.session = {
    testId: test.id,
    testName: test.name,
    folder: test.folder,
    opts,
    startedAt: Date.now(),
    elapsedSec: 0,
    timeLimitSec: (opts.timeLimitMin || 0) * 60,
    questions: qs,
    answers: qs.map(() => null),
    flags: qs.map(() => false),
    notes: qs.map(() => ''),
    submitted: false
  };

  state.screen = 'quiz';
  saveSession();
  render();
  startTimer();
}

function resumeSession(saved) {
  saved.startedAt = Date.now() - (saved.elapsedSec || 0) * 1000;
  saved.submitted = false;
  state.session = saved;
  state.screen = 'quiz';
  render();
  startTimer();
}

function loadSavedSession(id) {
  const s = store.get(sessionKey(id), null);
  if (!s || s.submitted || !Array.isArray(s.questions) || !s.questions.length) return null;
  return s;
}

let saveTimer = null;
function saveSession() {
  if (!state.session) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const s = state.session;
    if (!s || s.submitted) return;
    s.elapsedSec = Math.floor((Date.now() - s.startedAt) / 1000);
    store.set(sessionKey(s.testId), s);
  }, CONFIG.autosaveDebounceMs);
}

function saveResult(session, ratio) {
  const rec = state.results[session.testId] || { best: 0, attempts: 0, last: 0 };
  rec.best = Math.max(rec.best, ratio);
  rec.last = ratio;
  rec.attempts += 1;
  rec.lastDate = Date.now();
  state.results[session.testId] = rec;
  store.set('results', state.results);
}

/* ==================================================================
   15. TIMER
   ================================================================== */
let timerId = null;
function startTimer() {
  stopTimer();
  timerId = setInterval(tickTimer, 200);
  tickTimer();
}
function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
}
function tickTimer() {
  const s = state.session;
  if (!s || s.submitted) { stopTimer(); return; }

  const elapsed = Math.floor((Date.now() - s.startedAt) / 1000);
  const el = document.getElementById('timer');
  if (!el) return;

  if (s.timeLimitSec > 0) {
    const remain = s.timeLimitSec - elapsed;
    el.textContent = '⏳ ' + fmtTime(Math.max(0, remain));
    el.classList.toggle('danger', remain <= 60);
    if (remain <= 0) doSubmit(true);
  } else {
    el.textContent = '⏱ ' + fmtTime(elapsed);
  }
}

function progressText() {

}
function progressPct() {
  const s = state.session;
  const answered = s.answers.filter(a => a !== null).length;
  return s.questions.length ? (answered / s.questions.length) * 100 : 0;
}

function renderQuiz(main) {

      ),

function renderQuestionCard(q, idx) {
  const s = state.session;

  const noteArea = h('textarea', {
    class: 'note-area', rows: 3, placeholder: 'Write a note for this question…',
    oninput: e => {
      s.notes[idx] = e.target.value;
      saveSession();
      noteBtn.classList.toggle('on', !!e.target.value.trim());
    }
  });
  noteArea.value = s.notes[idx] || '';

  const notePanel = h('div', { class: 'note-panel hidden' }, noteArea);

  const flagBtn = h('button', {
    class: 'chip' + (s.flags[idx] ? ' on' : ''),
    onclick: () => {
      s.flags[idx] = !s.flags[idx];
      saveSession();
      flagBtn.classList.toggle('on', s.flags[idx]);
      flagBtn.textContent = '🚩 ' + (s.flags[idx] ? 'Flagged' : 'Flag');
      updatePalette();
    }
  }, '🚩 ' + (s.flags[idx] ? 'Flagged' : 'Flag'));

  const noteBtn = h('button', {
    class: 'chip' + ((s.notes[idx] || '').trim() ? ' on' : ''),
    onclick: () => {
      notePanel.classList.toggle('hidden');
      if (!notePanel.classList.contains('hidden')) noteArea.focus();
    }
  }, '📝 Note');

  const optList = h('div', { class: 'options' });
  q.options.forEach((opt, oi) => {
    const btn = h('button', {
      class: 'option' + (s.answers[idx] === oi ? ' selected' : ''),
      onclick: () => {
        s.answers[idx] = (s.answers[idx] === oi) ? null : oi;
        saveSession();
        Array.from(optList.children).forEach((el, k) => {
          el.classList.toggle('selected', s.answers[idx] === k);
        });
        updateProgress();
        updatePalette();
      }
    },
      h('span', { class: 'opt-key' }, String.fromCharCode(65 + oi)),
      h('span', { class: 'opt-text' }, opt)
    );
    optList.append(btn);
  });

  return h('div', { class: 'q-card', dataset: { qindex: String(idx) } },
    h('div', { class: 'q-head' },
      h('div', { class: 'q-index' }, `Question ${idx + 1}`),
      h('div', { class: 'q-actions' }, flagBtn, noteBtn)
    ),
    h('div', { class: 'q-text' }, q.text),
    /* Chỉ render <img> khi q.image có giá trị; onerror tự xoá nếu 404 */
    q.image ? h('img', {
      class: 'q-image',
      src: q.image,
      alt: 'Question image',
      loading: 'lazy',
      onerror: e => e.currentTarget.remove()
    }) : null,
    optList,
    notePanel
  );
}

function updateProgress() {
  const p = document.getElementById('quizProgress');
  if (p) p.textContent = progressText();
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = progressPct() + '%';
}

function updatePalette() {
  const s = state.session;
  $$('#palette .p-item').forEach((el, idx) => {
    el.classList.toggle('answered', s.answers[idx] !== null);
    el.classList.toggle('flagged', !!s.flags[idx]);
  });
}

function scrollToQuestion(idx) {
  const el = document.querySelector(`.q-card[data-qindex="${idx}"]`);
  if (!el) return;
  const header = document.querySelector('.quiz-header');
  const offset = (header ? header.offsetHeight : 0) + 12;
  const top = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top, behavior: 'smooth' });
  const side = document.getElementById('quizSide');
  if (side) side.classList.remove('open');
}

/* ---------- scroll spy for current question highlight ---------- */
let scrollSpyTick = false;
function setupScrollSpy() {
  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
}
function onScroll() {
  if (state.screen !== 'quiz') return;
  if (scrollSpyTick) return;
  scrollSpyTick = true;
  requestAnimationFrame(() => {
    scrollSpyTick = false;
    updateCurrentFromScroll();
  });
}
function updateCurrentFromScroll() {
  const cards = $$('#questionList .q-card');
  if (!cards.length) return;
  const header = document.querySelector('.quiz-header');
  const offset = (header ? header.offsetHeight : 0) + 40;
  let currentIdx = 0;
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    if (rect.top - offset <= 0) currentIdx = i;
    else break;
  }
  $$('#palette .p-item').forEach((el, i) => el.classList.toggle('current', i === currentIdx));
}

/* ---------- submit / exit ---------- */
function confirmLeave() {
  const s = state.session;
  if (!s || s.submitted) { goHome(); return; }
  if (confirm('Leave this test? Your progress is saved — you can resume later.')) {
    saveSession();
    stopTimer();
    goHome();
  }
}

function confirmSubmit() {
  const s = state.session;
  if (!s || s.submitted) return;
  const unanswered = s.answers.filter(a => a === null).length;
  const msg = unanswered
    ? `You still have ${unanswered} unanswered question${unanswered === 1 ? '' : 's'}. Submit anyway?`
    : 'Submit and see your results?';
  if (confirm(msg)) doSubmit(false);
}

function doSubmit(auto) {
  const s = state.session;
  if (!s || s.submitted) return;

  s.submitted = true;
  s.finishedAt = Date.now();
  s.elapsedSec = Math.floor((s.finishedAt - s.startedAt) / 1000);

  const total = s.questions.length;
  const correct = s.questions.reduce((n, q, i) => n + (s.answers[i] === q.answerIndex ? 1 : 0), 0);
  saveResult(s, total ? correct / total : 0);

  clearTimeout(saveTimer);
  store.del(sessionKey(s.testId));
  stopTimer();

  state.screen = 'result';
  state.reviewFilter = 'all';
  render();

  if (auto) toast('⏰ Time is up — auto-submitted.');
}

/* ==================================================================
   17. RESULT SCREEN
   ================================================================== */
function renderResult(main) {
  const s = state.session;
  if (!s) { goHome(); return; }

  const total = s.questions.length;
  const correct = s.questions.reduce((n, q, i) => n + (s.answers[i] === q.answerIndex ? 1 : 0), 0);
  const wrong = s.questions.reduce((n, q, i) => n + (s.answers[i] !== null && s.answers[i] !== q.answerIndex ? 1 : 0), 0);
  const skipped = total - correct - wrong;
  const ratio = total ? correct / total : 0;
  const passed = ratio >= CONFIG.passRatio;
  const elapsed = s.elapsedSec || Math.floor(((s.finishedAt || Date.now()) - s.startedAt) / 1000);

  const hero = h('div', { class: 'result-hero' },
    h('div', { class: 'score-big ' + (passed ? 'pass' : 'fail') }, `${Math.round(ratio * 100)}%`),
    h('div', { class: 'score-sub' }, passed ? '✅ Passed' : '❌ Keep practicing'),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, `${correct}/${total}`), h('span', {}, 'Correct')),
      h('div', { class: 'stat' }, h('b', {}, String(wrong)), h('span', {}, 'Wrong')),
      h('div', { class: 'stat' }, h('b', {}, String(skipped)), h('span', {}, 'Skipped')),
      h('div', { class: 'stat' }, h('b', {}, fmtTime(elapsed)), h('span', {}, 'Time'))
    )
  );

  const toolbar = h('div', { class: 'toolbar' },
    h('button', { class: 'btn primary', onclick: retake }, '🔄 Retake'),
    h('button', { class: 'btn ghost', onclick: toggleAllExplanations }, '💡 Show all explanations'),
    h('button', { class: 'btn ghost', onclick: goHome }, '← All tests')
  );

  const filters = h('div', { class: 'filters', id: 'filters' },
    filterBtn('all', 'All'),
    filterBtn('wrong', 'Wrong / skipped'),
    filterBtn('flagged', 'Flagged')
  );

  const list = h('div', { class: 'review-list', id: 'reviewList' });

  main.append(h('div', { class: 'page' },
    h('div', { class: 'setup-title' }, s.testName),
    h('div', { class: 'setup-sub' }, s.folder || ''),
    hero, toolbar, filters, list
  ));

  renderReviewList();
}

function filterBtn(key, label) {
  return h('button', {
    class: 'filter-btn' + (state.reviewFilter === key ? ' active' : ''),
    onclick: () => { state.reviewFilter = key; renderResult($('#main')); }
  }, label);
}

function renderReviewList() {
  const host = $('#reviewList');
  if (!host) return;
  host.innerHTML = '';

  const s = state.session;
  let shown = 0;

  s.questions.forEach((q, i) => {
    const ans = s.answers[i];
    const isCorrect = ans === q.answerIndex;
    const isFlagged = !!s.flags[i];

    if (state.reviewFilter === 'wrong' && isCorrect) return;
    if (state.reviewFilter === 'flagged' && !isFlagged) return;

    shown++;
    host.append(reviewItem(q, i, ans, isCorrect, isFlagged, s.notes[i]));
  });

  if (!shown) host.append(h('div', { class: 'empty' }, 'Nothing to show for this filter.'));
}

function reviewItem(q, idx, ans, isCorrect, isFlagged, note) {
  const explainBox = h('div', { class: 'explain hidden' },
    q.explain || 'No explanation provided for this question.');

  const explainBtn = h('button', {
    class: 'btn ghost sm',
    onclick: () => {
      const nowHidden = explainBox.classList.toggle('hidden');
      explainBtn.textContent = nowHidden ? '💡 Show explanation' : '💡 Hide explanation';
    }
  }, '💡 Show explanation');

  const optList = h('div', { class: 'review-opts' });
  q.options.forEach((opt, oi) => {
    const classes = ['ropt'];
    if (oi === q.answerIndex) classes.push('correct');
    else if (oi === ans) classes.push('chosen-wrong');
    optList.append(h('div', { class: classes.join(' ') },
      h('span', { class: 'k' }, String.fromCharCode(65 + oi)),
      h('span', {}, opt)
    ));
  });

  return h('div', { class: 'review-item ' + (isCorrect ? 'ok' : 'bad') },
    h('div', { class: 'review-head' },
      h('span', { class: 'badge ' + (isCorrect ? 'ok' : 'bad') },
        isCorrect ? '✓ Correct' : (ans === null ? '— Skipped' : '✗ Wrong')),
      h('span', { class: 'review-qno' }, `Question ${idx + 1}`),
      isFlagged ? h('span', { class: 'badge', style: { background: 'var(--yellow-soft)', color: 'var(--yellow)' } }, '🚩 Flagged') : null
    ),
    h('div', { class: 'review-q' }, q.text),
    q.image ? h('img', {
      class: 'q-image',
      src: q.image,
      alt: 'Question image',
      loading: 'lazy',
      onerror: e => e.currentTarget.remove()
    }) : null,
    optList,
    (note && note.trim()) ? h('div', { class: 'review-note' }, '📝 ' + note) : null,
    explainBtn,
    explainBox
  );
}

function toggleAllExplanations() {
  const boxes = $$('#reviewList .explain');
  if (!boxes.length) return;
  const anyHidden = boxes.some(b => b.classList.contains('hidden'));
  boxes.forEach(b => b.classList.toggle('hidden', !anyHidden));
  $$('#reviewList .btn.ghost.sm').forEach(btn => {
    if (btn.textContent.includes('explanation')) {
      btn.textContent = anyHidden ? '💡 Hide explanation' : '💡 Show explanation';
    }
  });
}

function retake() {
  if (!state.pendingTest || !state.pendingQuestions) { goHome(); return; }
  const opts = (state.session && state.session.opts) || {
    count: state.pendingQuestions.length,
    timeLimitMin: CONFIG.defaultTimeMin,
    shuffleQuestions: false,
    shuffleOptions: false
  };
  startSession(state.pendingTest, state.pendingQuestions, opts);
}

/* ==================================================================
   18. KEYBOARD SHORTCUTS (quiz only)
   ================================================================== */
document.addEventListener('keydown', e => {
  if (state.screen !== 'quiz') return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

  const s = state.session;
  if (!s || s.submitted) return;

  if (/^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const cards = $$('#questionList .q-card');
    const header = document.querySelector('.quiz-header');
    const offset = (header ? header.offsetHeight : 0) + 40;
    let current = 0;
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].getBoundingClientRect().top - offset <= 0) current = i;
      else break;
    }
    const q = s.questions[current];
    if (idx < q.options.length) {
      const optList = cards[current].querySelector('.options');
      s.answers[current] = (s.answers[current] === idx) ? null : idx;
      saveSession();
      Array.from(optList.children).forEach((el, k) => {
        el.classList.toggle('selected', s.answers[current] === k);
      });
      updateProgress();
      updatePalette();
      e.preventDefault();
    }
  } else if (e.key.toLowerCase() === 'f') {
    const cards = $$('#questionList .q-card');
    const header = document.querySelector('.quiz-header');
    const offset = (header ? header.offsetHeight : 0) + 40;
    let current = 0;
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].getBoundingClientRect().top - offset <= 0) current = i;
      else break;
    }
    s.flags[current] = !s.flags[current];
    saveSession();
    const flagBtn = cards[current].querySelector('.chip');
    if (flagBtn) {
      flagBtn.classList.toggle('on', s.flags[current]);
      flagBtn.textContent = '🚩 ' + (s.flags[current] ? 'Flagged' : 'Flag');
    }
    updatePalette();
    e.preventDefault();
  }
});

/* ==================================================================
   19. BOOT
   ================================================================== */
async function init() {
  state.theme = store.get('theme', 'dark');
  applyTheme();
  state.results = store.get('results', {}) || {};

  $('#themeBtn').addEventListener('click', toggleTheme);
  $('#brandBtn').addEventListener('click', goHome);
  $('#brandBtn').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
  });

  try {
    state.catalog = await loadCatalog();
  } catch (err) {
    state.error = err.message;
    state.screen = 'error';
    render();
    return;
  }

  state.screen = 'home';
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
